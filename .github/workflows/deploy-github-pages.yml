name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          CARDAPIO_WEB_TOKEN: ${{ secrets.CARDAPIO_WEB_TOKEN }}
          CARDAPIO_WEB_PARTNER_KEY: ${{ secrets.CARDAPIO_WEB_PARTNER_KEY }}
          CARDAPIO_WEB_AUTH: ${{ secrets.CARDAPIO_WEB_AUTH }}
          NEXT_PUBLIC_CARDAPIO_WEB_STORE_CODE: ${{ secrets.CARDAPIO_WEB_STORE_CODE }}
          NEXT_PUBLIC_CARDAPIO_WEB_MENU_URL: ${{ secrets.CARDAPIO_WEB_MENU_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
